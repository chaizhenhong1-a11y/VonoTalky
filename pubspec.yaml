name: vonotalky
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  firebase_storage: ^13.4.6
  image_picker: ^1.2.3
  record: ^7.1.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  firebase_messaging: ^16.5.0
  file_selector: ^1.1.0
  dio: ^5.11.0
  open_filex: ^4.7.0
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  flutter_webrtc: ^1.6.0
  flutter_callkit_incoming: ^3.1.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pet/mochi/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
